<li class="list-group-item d-flex justify-content-between align-items-center gap-2">
    <span>{{ label }}</span>
    {% if link %}
        <a href="{{ link }}" class="btn btn-sm btn-primary" download><i class="fa fa-download me-1" aria-hidden="true"></i>Download</a>
    {% else %}
        <span class="small text-muted">Not available</span>
    {% endif %}
</li>
